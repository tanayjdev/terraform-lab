name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '**.pkr.hcl'
      - '.github/workflows/terraform-ci.yml'

  push:
    branches: [main]
    paths:
      - '**.tf'
      - '.github/workflows/terraform-ci.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::464975960111:role/github-actions-terraform-plan
          aws-region: ap-south-1

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -reconfigure

      - name: Select Terraform workspace
        run: terraform workspace select dev

      - name: Verify Terraform workspace
        run: |
          echo "Terraform workspace:"
          terraform workspace show

          echo "Terraform workspaces:"
          terraform workspace list

      - name: Terraform validate
        run: terraform validate

      - name: TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init
          tflint --recursive --minimum-failure-severity=error

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Post plan to PR
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const truncated =
              process.env.PLAN.length > 60000
                ? process.env.PLAN.substring(0, 60000) +
                  "\n\n... (truncated, see full log in Actions tab)"
                : process.env.PLAN;

            const output =
              `#### Terraform Plan Result\n\`\`\`\n${truncated}\n\`\`\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::464975960111:role/github-actions-terraform-apply
          aws-region: ap-south-1

      - name: Terraform init
        run: terraform init -reconfigure

      - name: Select Terraform workspace
        run: terraform workspace select dev

      - name: Verify Terraform workspace
        run: |
          echo "Terraform workspace:"
          terraform workspace show

          echo "Terraform workspaces:"
          terraform workspace list

      - name: Terraform plan
        run: terraform plan -no-color

      - name: Terraform apply
        run: terraform apply -auto-approve
