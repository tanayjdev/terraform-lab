plugin: amazon.aws.aws_ec2

regions:
  - ap-south-1

filters:
  tag:Project: terraform-mastery
  instance-state-name: running

keyed_groups:
  - key: tags.Environment
    prefix: env

compose:
  ansible_connection: "'community.aws.aws_ssm'"
  ansible_aws_ssm_bucket_name: "'tanay-ansible-ssm-transfer-2026'"
  ansible_aws_ssm_region: "'ap-south-1'"
  ansible_aws_ssm_instance_id: instance_id